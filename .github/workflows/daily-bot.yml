name: Daily Next Apply Alert Bot

on:
  schedule:
    # Pakistan Time (PKT = UTC+5) ke 3 alag waqt:
    - cron: "0 3 * * *"   # 8:00 AM PKT
    - cron: "45 7 * * *"  # 12:45 PM PKT
    - cron: "0 16 * * *"  # 9:00 PM PKT
  workflow_dispatch: {}   # Manual "Run workflow" button ke liye

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # sent_history.json commit karne ke liye

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run bot
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: node index.js

      - name: Commit updated history (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.json
          git diff --staged --quiet || git commit -m "Update sent history [skip ci]"
          git push
